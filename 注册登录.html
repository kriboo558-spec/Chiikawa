    <div class="nav-items">

<div style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('images/bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1;">
</div>

<div class="login-container">
    <div class="background-selector">
        <div class="bg-option active" data-bg="images/background.jpg"></div>
    </div>

    <div class="tab-container">
        <div class="tab" id="loginTab">登录</div>
        <div class="tab" id="registerTab">注册</div>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <input type="text" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <input type="password" placeholder="请输入密码">
        </div>
        <button type="submit" class="submit-btn">立即登录</button>
    </form>

    <form id="registerForm" style="display: none;">
        <div class="form-group">
            <input type="text" placeholder="请输入手机号">
            <button type="button" class="verify-btn" id="verifyBtn">
			    <span class="btn-text">获取验证码</span>
                <span class="countdown" style="display: none;"></span>
            </button>
        </div>
        <div class="form-group">
            <input type="text" placeholder="请输入验证码">
        </div>
        <div class="form-group">
            <input type="password" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <input type="password" placeholder="请确认密码">
        </div>
        <button type="submit" class="submit-btn">立即注册</button>
    </form>
    </div>
</div>
</body>
